name: Visual Regression

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]

jobs:
  visual-diff:
    if: contains(github.event.pull_request.labels.*.name, 'ui-migration')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci --prefix web

      - name: Build React app
        run: npm run build --prefix web

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run prototype visual regression tests
        run: pytest tests/visual/test_screens.py -v

      - name: Serve React app and run overview visual regression
        run: |
          python -m http.server 5173 --directory static/dist &
          sleep 2
          REACT_APP_URL=http://localhost:5173 pytest tests/visual/test_overview.py -v

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: tests/visual/_artifacts/
          if-no-files-found: ignore
